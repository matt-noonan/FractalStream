<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FractalStream</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <div id="welcome"></div>
  <main id="project-screen" hidden>
    <div id="toolbar">
      <button id="close" type="button" title="Close the project, back to the library" disabled>Close</button>
      <button id="toggle-panel" type="button" aria-pressed="true" title="Show or hide the configuration">Configuration</button>
      <button id="toggle-script" type="button" aria-pressed="false" title="Show or hide the project's script" disabled>Script</button>
      <span class="separator"></span>
      <span id="tools" class="palette" role="group" aria-label="Tools"></span>
      <span class="separator"></span>
      <button id="open" type="button" title="Open a project file (⌘O)">Open…</button>
      <button id="save" type="button" title="Save (⌘S)" disabled>Save</button>
      <button id="save-as" type="button" title="Save as (⇧⌘S)" disabled>Save as…</button>
      <span id="file-name"></span>
    </div>
    <div id="status" role="status"></div>
    <div id="project"></div>
  </main>
  <div id="notices"></div>
</body>
</html>
