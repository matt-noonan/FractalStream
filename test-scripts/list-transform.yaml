script: |
  @viewer "List Transform" var=z size="512x512" pixelSize="1/48"
  pts : List of C <- [1, i, -1, -i]
  squared : List of C <- transform(pts, w -> w^2)
  closest : R <- 1000
  for each c in squared:
    d : R <- |z - c|
    if d < closest:
      closest <- d
  color <- blend(exp(-closest * 8), white, black)
