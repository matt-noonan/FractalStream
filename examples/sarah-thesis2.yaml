script: |
  @config "Standard settings"
  max_iters : Z as "Iteration limit" <- 100
  max_radius : R as "Escape radius" <- 10
  min_radius : R as "Vanishing radius" <- 0.0001

  @viewer "Sarah thing" var=z size="600x600" limit="max_iters" escape="max_radius" vanish="min_radius"
  p : C <- z
  x : C <- z + 1
  y : C <- z (z+1)^2 + 1

  repeat:
      x <- (y^2 - 1)/y^2
      y <- (y^2 - x^2) / y^2
  until x = 0 and y = 1
  saved_count : Z <- iterations

  z <- 0
  iterate z -> p z^2 + 1 until z escapes

  if z escapes:
      color <- cycle(saved_count / 20, dark red, light red)
  else:
      color <- cycle(saved_count / 20, dark green, light green)
