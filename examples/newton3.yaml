script: |
  @config "Roots"
  a : C as "a =" <- 1
  b : C as "b =" <- e^(2 pi i / 3)
  c : C as "c =" <- e^(-2 pi i / 3)

  @config "Newton's method configuration"
  tol : R as "closeness" <- 0.01
  rad : R as "grab radius (px)" <- 5
  drag_target : Z as "Drag target: " <- 0

  @viewer "Roots of {f}" var=z size="512x512" vanish="tol"
  lastZ : C <- 0
  repeat:
    lastZ <- z
    z <- z - (z - a) (z - b) (z - c) / diff(z, (z - a) (z - b) (z - c))
  while z != lastZ

  col : Color <- yellow
  if z = a:
    col <- red
  else if z = b:
    col <- green
  else if z = c:
    col <- blue
  if z = lastZ:
    color <- blend ((cos (iterations pi / 10))^2, dark col, light col)
  else:
    color <- black

  @tool "Trace" shortcut="t"
  on deactivated:
    erase

  on click-or-drag:
    lastZ : C <- 0
    erase
    repeat:
      lastZ <- z
      z <- z - (z - a) (z - b) (z - c) / diff(z, (z - a) (z - b) (z - c))
      draw point at lastZ
      draw line from lastZ to z
    while z != lastZ

    draw point at z

  @tool "Move roots" shortcut="m"
  on activated:
    draw point at a
    draw point at b
    draw point at c

  on deactivated:
    erase

  on drag from z0 to z:
    if drag_target = 0:
      if |z0 - a| < rad pixel_size:
        drag_target <- 1
      else if |z0 - b| < rad pixel_size:
        drag_target <- 2
      else if |z0 - c| < rad pixel_size:
        drag_target <- 3
    else if drag_target = 1:
      a <- z
    else if drag_target = 2:
      b <- z
    else if drag_target = 3:
      c <- z
    erase
    draw point at a
    draw point at b
    draw point at c

  on refresh:
    erase
    draw point at a
    draw point at b
    draw point at c

  on drag-finished:
    drag_target <- 0
