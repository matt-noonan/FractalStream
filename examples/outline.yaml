script: |
  @config "Configuration"
  C : C as "Selected value of C:" <- -0.1226 + 0.7449i
  maxIters : Z as "Max. iterations: " <- 100
  big : R as "Max. radius: " <- 10
  tiny : R as "Min. radius: " <- 0.001
  fatness : R as "Fatness" <- 0.1

  @config "Colors"
  boundary_color : Color as "Boundary" <- black
  exterior_color : Color as "Exterior" <- white
  interior_color : Color as "Interior" <- rgb(0.926, 0.863, 0.927)

  @viewer "Parameter plane" var=C size="512x512" pixelVar=px limit="maxIters" escape="big" vanish="tiny"
  z : C <- 0
  dz : C <- 1

  tol : R <- px fatness / 2

  dzdc : C <- 0
  der : C <- 1

  repeat:
    dzdc <- 1 + 2 z dzdc
    z <- z^2 + C
    der <- 2 z der
  until |z / dzdc| < tol or z escapes or der vanishes

  if z escaped:
    color <- exterior_color
  else if |z / dzdc| < tol:
    color <- boundary_color
  else:
    color <- interior_color

  @viewer "Dynamical plane" var=z size="512x512" pixelVar=px limit="maxIters" escape="big" vanish="tiny"
  dz : C <- 1
  w : C <- z
  tol : R <- 2 px fatness

  repeat:
    dz <- 2 z dz
    z <- z^2 + C
  until z escapes or |z/dz - w/dz| < tol or dz vanishes

  if z escaped:
    color <- exterior_color
  else if |z/dz - w/dz| < tol:
    color <- boundary_color
  else:
    color <- interior_color
