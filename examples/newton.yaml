script: |
  @setup "Newton's method setup"
  f : C as "f(z) = " using z:C <- z^3 - 1

  @config "Newton's method configuration"
  tol : R as "closeness" <- 0.01

  @viewer "Roots of f" var=z size=512x512 vanish=tol center=0 pixelSize=1/128
  lastZ : C <- 0
  while z != lastZ:
    lastZ <- z
    z <- z - «f» / diff(z, «f»)
  if z = lastZ:
    c : Color <- if re(z) > 0 then red else if im(z) > 0 then yellow else blue
    s : R <- (cos (iterations pi / 10))^2
    color <- rainbow(arg z / (2π))
    color <- cycle(iterations / 20, dark color, light color)
  else:
    color <- black

  @tool "Trace" for="Roots of f" shortcut=t
  on deactivated:
    erase
  on click-or-drag:
    lastZ : C <- 0
    erase
    while z != lastZ:
      lastZ <- z
      z <- z - «f» / diff(z, «f»)
      draw point at lastZ
      draw line from lastZ to z
    draw point at z
