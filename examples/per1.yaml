script: |
  @config "Configuration"
  λ : C as "λ = " <- 0.9 e^{2 pi i / 3}
  t : C as "t = " <- 0.7 - 0.6i
  max_iters : Z as "Max. iterations:" <- 1000
  escape_radius : R as "Escape radius:" <- 10
  vanishing_radius : R as "Tolerance:" <- 0.00001

  @viewer "λ-plane" var=λ size="500x500" pixelSize="1/250" limit="max_iters" escape="escape_radius"
  color <- if |λ| < 1 then (if re(λ) * im(λ) > 0 then light grey else white) else black

  @viewer "t-plane" var=t size="512x512" escape="escape_radius" vanish="vanishing_radius" limit="max_iters"
  crit1 : C <- 1
  crit2 : C <- -1

  z : C <- crit1
  iterate z -> λ z / (z^2 + t z + 1) until z vanishes
  crit1_went_to_0 : Boolean <- z vanished
  iters1 : Z <- iterations

  z <- crit2
  iterate z -> λ z / (z^2 + t z + 1) until z vanishes
  crit2_went_to_0 : Boolean <- z vanished
  iters2 : Z <- iterations

  color <- white
  if crit1_went_to_0:
    if crit2_went_to_0:
      color <- purple
    else:
      color <- fire(iters1 / 20)
  if crit2_went_to_0:
    color <- ice(iters2 / 20)

  @viewer "Dynamics" var=z size="512x512" escape="escape_radius" vanish="vanishing_radius" limit="max_iters"
  iterate z -> λ z / (z^2 + t z + 1) until z vanishes
  color <- if stuck then black else rainbow(iterations / 20)

  @tool "Trace" for="Dynamics" shortcut="t"
  on refresh:
    erase

  on click-or-drag:
    prevZ : C <- z
    erase
    until z vanishes:
      prevZ <- z
      draw point at z
      z <- λ z / (z^2 + t z + 1)
      draw line from z to prevZ
