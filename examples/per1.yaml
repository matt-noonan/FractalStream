viewers:
  - title: λ-plane
    style: complex-plane
    size: 500x500
    resizable: true
    z-coord: λ
    escape-radius: escape_radius
    iteration-limit: max_iters
    initial-center: 0
    initial-pixel-size: 1/250
    code: |
      color <- if |λ| < 1 then (if re(λ) * im(λ) > 0 then light grey else white) else black

  - title: t-plane
    style: complex-plane
    size: 512x512
    resizable: true
    z-coord: t
    escape-radius: escape_radius
    vanishing-radius: vanishing_radius
    iteration-limit: max_iters
    initial-center: 0
    initial-pixel-size: 1/128
    code: |
      # Compute the critical points of f_{t,λ}
      crit1 : C <- 1
      crit2 : C <- -1

      # See if both critical points are attracted to 0
      z : C <- crit1
      iterate z -> λ z / (z^2 + t z + 1) until z vanishes
      crit1_went_to_0 : Boolean <- z vanished
      iters1 : Z <- iterations

      z <- crit2
      iterate z -> λ z / (z^2 + t z + 1) until z vanishes
      crit2_went_to_0 : Boolean <- z vanished
      iters2 : Z <- iterations

      color <- white
      if crit1_went_to_0:
        if crit2_went_to_0:
          color <- purple
        else:
          color <- fire(iters1 / 20)
      if crit2_went_to_0:
        color <- ice(iters2 / 20)

  - title: Dynamics
    style: complex-plane
    size: 512x512
    resizable: true
    z-coord: z
    escape-radius: escape_radius
    vanishing-radius: vanishing_radius
    iteration-limit: max_iters
    initial-center: 0
    initial-pixel-size: 1/128
    code: |
      iterate z -> λ z / (z^2 + t z + 1) until z vanishes
      color <- if stuck then black else rainbow(iterations / 20)
    tools:
      - name: Trace
        shortcut: t
        script: |
          on refresh:
            erase

          on click-or-drag:
            prevZ : C <- z
            erase
            until z vanishes:
              prevZ <- z
              draw point at z
              z <- λ z / (z^2 + t z + 1)
              draw line from z to prevZ
configuration:
  title: Configuration
  size: 400x200
  vertical-contents:
    - text-entry:
        label: "λ = "
        value: "0.9 e^{2 pi i / 3}"
        type: C
        variable: λ
    - text-entry:
        label: "t = "
        value: "0.7 - 0.6𝑖"
        type: C
        variable: t
    - text-entry:
        label: "Max. iterations:"
        value: "1000"
        type: Z
        variable: max_iters
    - text-entry:
        label: "Escape radius:"
        value: 10
        type: R
        variable: escape_radius
    - text-entry:
        label: "Tolerance:"
        value: "0.00001"
        type: R
        variable: vanishing_radius
