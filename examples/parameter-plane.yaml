script: |
  @setup "Parametric complex dynamics"
  f : C as "Iterate f(z) = " using z:C, C:C <- z^2 + C
  stop : Boolean as "until" using z:C, C:C, escape_radius:R <- |z| > escape_radius

  @config "Configuration"
  C : C as "Selected value of C:" <- -0.1226 + 0.7449i

  @viewer "Parameter plane" var=C size="512x512" center="0" pixelSize="1/128"
  z : C <- 0
  iterate z -> «f» until «stop»

  if «stop»:
    c1 : Color <- if im(z) > 0 then blue else yellow
    c2 : Color <- if im(z) > 0 then green else red
    s : R <- iterations + 1 - (log (log (|z|^2 / 2))) / log 2
    s <- cos (s pi / 10)^2
    color <- blend (s, c1, c2)
  else:
    color <- black

  @viewer "Dynamical plane" var=z size="512x512" center="0" pixelSize="1/128"
  iterate z -> «f» until «stop»

  if «stop»:
    c1 : Color <- if im(z) > 0 then blue else yellow
    c2 : Color <- if im(z) > 0 then green else red
    s : R <- iterations + 1 - (log (log (|z|^2 / 2))) / log 2
    s <- cos (s pi / 10)^2
    color <- blend (s, c1, c2)
  else:
    color <- black

  @tool "Trace" for="Dynamical plane" shortcut="t"
  on deactivated:
    erase
  on click-or-drag:
    prevZ : C <- z
    erase
    until «stop»:
      prevZ <- z
      draw point at z
      z <- «f»
      draw line from z to prevZ
