configuration:
  title: Configuration
  size: 400x200
  vertical-contents:
    - text-entry:
        label: "f(z) = z² +"
        value: "-0.11 + 0.78i"
        type: ℂ
        variable: C
    - text-entry:
        label: "Max. iterations:"
        value: "100"
        type: ℤ
        variable: max_iters
    - text-entry:
        label: "Escape radius:"
        value: 10
        type: ℝ
        variable: escape_radius

viewers:
  - title: Parameter plane
    style: complex-plane
    size: 512x512
    resizable: true
    z-coord: C
    escape-radius: escape_radius
    iteration-limit: max_iters
    initial-center: 0
    initial-pixel-size: 1/128
    code: |
      z : ℂ ⭠ 0
      iterate z ⟼ z² + C until z escapes

      color ⭠ black
      if z escapes:
        # see https://linas.org/art-gallery/escape/ray.html
        m : ℝ ⭠ iterations + 1 ...
                 - log (log (|z|²) / (2 log escape_radius)) / log 2
        base_color : Color ⭠ if im z > 0 then dark purple else dark green
        color ⭠ blend (cos (π m / 20)², base_color, light base_color)

    tools:
      - name: Parameter plane external rays
        shortcut: r
        configuration:
          title: Parameter ray
          size: 400x200
          vertical-contents:
            - panel:
                title: p/q
                horizontal-contents:
                  - text-entry:
                      label: "Numerators: "
                      value: "0, 1, 2"
                      type: List of ℤ
                      variable: ps
                  - text-entry:
                      label: "Denominator: "
                      value: "3"
                      type: ℤ
                      variable: q
            - panel:
                title: Approximation settings
                vertical-contents:
                  - text-entry:
                      label: "Subdivisions per level set: "
                      value: "10"
                      type: ℤ
                      variable: S
                  - text-entry:
                      label: "Step size"
                      value: "0.0001"
                      type: ℝ
                      variable: error
                  - text-entry:
                      label: "Newton iteration limit"
                      value: "100"
                      type: ℤ
                      variable: iter_limit
        actions:
            - event: refresh
              code: |
                erase

                # This is nearly a literal copy of
                # https://github.com/sagemath/sage/blob/develop/src/sage/dynamics/complex_dynamics/mandel_julia_helper.pyx#L179-L287

                for each p in ps:

                  R : ℝ ⭠ escape_radius

                  theta : ℝ ⭠ p / q
                  z : ℂ ⭠ R e^{2 π 𝑖 theta}

                  dist : ℝ ⭠ error

                  k : ℤ ⭠ 0
                  while dist >= error:
                    k ⭠ k + 1
                    j : ℤ ⭠ 0
                    while j < S and dist >= error:
                      j ⭠ j + 1
                      m : ℝ ⭠ (k - 1) S + j
                      r_m : ℝ ⭠ R^(2^(-m / S))
                      t_m : ℂ ⭠ r_m^(2^k) e^{2^{k+1} π 𝑖 theta}
                      temp_c : ℂ ⭠ z
                      difference : ℝ ⭠ error

                      C_k : ℂ ⭠ temp_c
                      D_k : ℂ ⭠ 1

                      n : ℤ ⭠ 0
                      while difference >= error up to iter_limit times:
                        n ⭠ n + 1
                        old_c : ℂ ⭠ temp_c
                        C_k ⭠ old_c
                        D_k ⭠ 1

                        # Work out C_k = f^{\circ k}(z) and
                        # D_k = d/dz (f^{\circ k}(z))
                        while true up to k times:
                          D_k ⭠ 2 D_k C_k + 1
                          C_k ⭠ C_k² + old_c

                        # Use C_k and D_k to take one step of
                        # Newton's method for f^{\circ(k)}(z) - t_m
                        temp_c ⭠ old_c - (C_k - t_m) / D_k
                        difference ⭠ |old_c - temp_c|

                      if difference < error:
                        dist ⭠ 2 |C_k| log |C_k| / |D_k|
                        draw line from z to temp_c
                        z ⭠ temp_c
                      else:
                        dist ⭠ 0 # failed to converge, break out of the loops
                        draw filled circle at z with radius error

            - event: deactivated
              code: erase

  - title: Dynamical plane
    style: complex-plane
    size: 512x512
    resizable: true
    z-coord: z
    escape-radius: escape_radius
    iteration-limit: max_iters
    pixel-size: px
    initial-center: 0
    initial-pixel-size: 1/128
    code: |
      iterate z ⟼ z² + C until z escapes

      color ⭠ black
      if z escaped:
        # see https://linas.org/art-gallery/escape/ray.html
        m : ℝ ⭠ iterations + 1 ...
                 - log (log (|z|²) / (2 log escape_radius)) / log 2
        base_color : Color ⭠ if im z > 0 then dark purple else dark green
        color ⭠ blend (cos (π m / 20)², base_color, light base_color)

    tools:

      - name: Dynamical plane external rays
        shortcut: r
        configuration:
          title: Parameter ray
          size: 400x200
          vertical-contents:
            - panel:
                title: p/q
                horizontal-contents:
                  - text-entry:
                      label: "Numerators:"
                      value: "1, 2, 4"
                      type: List of ℤ
                      variable: ps
                  - text-entry:
                      label: "Denominator:"
                      value: "7"
                      type: ℤ
                      variable: q
            - panel:
                title: Approximation settings
                vertical-contents:
                  - text-entry:
                      label: "Subdivisions per level set: "
                      value: "10"
                      type: ℤ
                      variable: S
                  - text-entry:
                      label: "Step size"
                      value: "0.0001"
                      type: ℝ
                      variable: error
                  - text-entry:
                      label: "Newton iteration limit"
                      value: "100"
                      type: ℤ
                      variable: iter_limit

        actions:
            - event: refresh
              code: |
                erase

                for each p in ps:

                  R : ℝ ⭠ escape_radius

                  theta : ℝ ⭠ p / q
                  z : ℂ ⭠ R e^{2 π 𝑖 theta}

                  dist : ℝ ⭠ error

                  k : ℤ ⭠ 0
                  while dist >= error:
                    k ⭠ k + 1
                    j : ℤ ⭠ 0
                    while dist >= error up to S times:
                      j ⭠ j + 1
                      m : ℝ ⭠ (k - 1) S + j
                      r_m : ℝ ⭠ R^(2^(-m / S))
                      t_m : ℂ ⭠ r_m^(2^k) e^{2^{k+1} π 𝑖 theta}

                      difference : ℝ ⭠ error

                      temp_z : ℂ ⭠ z

                      # these get initialized for real below, in the loop
                      z_k : ℂ ⭠ 0
                      dz_k : ℂ ⭠ 0

                      while difference >= error up to iter_limit times:

                        old_z : ℂ ⭠ temp_z
                        z_k ⭠ temp_z
                        dz_k ⭠ 1

                        # Work out z_k = f^{\circ k}(z) and
                        # dz_k = d/dz (f^{\circ k}(z))
                        t : ℤ ⭠ 0
                        while t < k:
                          t ⭠ t + 1
                          dz_k ⭠ 2 dz_k z_k
                          z_k ⭠ z_k² + C

                        # Use z_k and dz_k to take one step of
                        # Newton's method for f^{\circ(k)}(z) - t_m
                        temp_z ⭠ old_z - (z_k - t_m) / dz_k
                        difference ⭠ |old_z - temp_z|

                      if difference < error:
                        dist ⭠ |z - temp_z|
                        draw line from z to temp_z
                        z ⭠ temp_z
                      else:
                        dist ⭠ 0 # failed to converge, break out of the loops
                        draw filled circle at z with radius error

            - event: deactivated
              code: erase
