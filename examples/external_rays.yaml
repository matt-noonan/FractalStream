script: |
  @config "Configuration"
  C : C as "f(z) = z² +" <- -0.11 + 0.78i

  @viewer "Parameter plane" var=C size="512x512" center="0" pixelSize="1/128"
  z : ℂ ⭠ 0
  iterate z ⟼ z² + C until z escapes

  color ⭠ black
  if z escapes:
    m : ℝ ⭠ iterations + 1 ...
             - log (log (|z|²) / (2 log escape_radius)) / log 2
    base_color : Color ⭠ if im z > 0 then dark purple else dark green
    color ⭠ blend (cos (π m / 20)², base_color, light base_color)

  @tool "Parameter plane external rays" for="Parameter plane" shortcut="r"
  row:
    ps : List of Z as "Numerators: " <- [0, 1, 2]
    q : Z as "Denominator: " <- 3
  S : Z as "Subdivisions per level set: " <- 10
  error : R as "Step size" <- 0.0001
  iter_limit : Z as "Newton iteration limit" <- 100
  on refresh:
    erase
    for each p in ps:
      R : ℝ ⭠ escape_radius
      theta : ℝ ⭠ p / q
      z : ℂ ⭠ R e^{2 π 𝑖 theta}
      dist : ℝ ⭠ error
      k : ℤ ⭠ 0
      while dist >= error:
        k ⭠ k + 1
        j : ℤ ⭠ 0
        while j < S and dist >= error:
          j ⭠ j + 1
          m : ℝ ⭠ (k - 1) S + j
          r_m : ℝ ⭠ R^(2^(-m / S))
          t_m : ℂ ⭠ r_m^(2^k) e^{2^{k+1} π 𝑖 theta}
          temp_c : ℂ ⭠ z
          difference : ℝ ⭠ error
          C_k : ℂ ⭠ temp_c
          D_k : ℂ ⭠ 1
          n : ℤ ⭠ 0
          while difference >= error up to iter_limit times:
            n ⭠ n + 1
            old_c : ℂ ⭠ temp_c
            C_k ⭠ old_c
            D_k ⭠ 1
            while true up to k times:
              D_k ⭠ 2 D_k C_k + 1
              C_k ⭠ C_k² + old_c
            temp_c ⭠ old_c - (C_k - t_m) / D_k
            difference ⭠ |old_c - temp_c|
          if difference < error:
            dist ⭠ 2 |C_k| log |C_k| / |D_k|
            draw line from z to temp_c
            z ⭠ temp_c
          else:
            dist ⭠ 0
            draw filled circle at z with radius error
  on deactivated:
    erase

  @viewer "Dynamical plane" var=z size="512x512" center="0" pixelSize="1/128"
  iterate z ⟼ z² + C until z escapes

  color ⭠ black
  if z escaped:
    m : ℝ ⭠ iterations + 1 ...
             - log (log (|z|²) / (2 log escape_radius)) / log 2
    base_color : Color ⭠ if im z > 0 then dark purple else dark green
    color ⭠ blend (cos (π m / 20)², base_color, light base_color)

  @tool "Dynamical plane external rays" for="Dynamical plane" shortcut="r"
  row:
    ps : List of Z as "Numerators:" <- [1, 2, 4]
    q : Z as "Denominator:" <- 7
  S : Z as "Subdivisions per level set: " <- 10
  error : R as "Step size" <- 0.0001
  iter_limit : Z as "Newton iteration limit" <- 100
  on refresh:
    erase
    for each p in ps:
      R : ℝ ⭠ escape_radius
      theta : ℝ ⭠ p / q
      z : ℂ ⭠ R e^{2 π 𝑖 theta}
      dist : ℝ ⭠ error
      k : ℤ ⭠ 0
      while dist >= error:
        k ⭠ k + 1
        j : ℤ ⭠ 0
        while dist >= error up to S times:
          j ⭠ j + 1
          m : ℝ ⭠ (k - 1) S + j
          r_m : ℝ ⭠ R^(2^(-m / S))
          t_m : ℂ ⭠ r_m^(2^k) e^{2^{k+1} π 𝑖 theta}
          difference : ℝ ⭠ error
          temp_z : ℂ ⭠ z
          z_k : ℂ ⭠ 0
          dz_k : ℂ ⭠ 0
          while difference >= error up to iter_limit times:
            old_z : ℂ ⭠ temp_z
            z_k ⭠ temp_z
            dz_k ⭠ 1
            t : ℤ ⭠ 0
            while t < k:
              t ⭠ t + 1
              dz_k ⭠ 2 dz_k z_k
              z_k ⭠ z_k² + C
            temp_z ⭠ old_z - (z_k - t_m) / dz_k
            difference ⭠ |old_z - temp_z|
          if difference < error:
            dist ⭠ |z - temp_z|
            draw line from z to temp_z
            z ⭠ temp_z
          else:
            dist ⭠ 0
            draw filled circle at z with radius error
  on deactivated:
    erase
