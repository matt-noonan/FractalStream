script: |
  @config "Newton's method configuration"
  a : C as "a =" <- 0
  tol : R as "closeness" <- 0.01

  @viewer "Parameter plane" var=a size=512x512 vanish=tol
  r1 : C <- 1
  r2 : C <- -0.5 + a
  r3 : C <- -0.5 - a
  z : C <- 0
  lastZ : C <- 0

  repeat:
    lastZ <- z
    f : C <- (z - r1) (z - r2) (z - r3)
    df : C <- (z - r2) (z - r3) + (z - r1) (z - r3) + (z - r1) (z - r2)
    z <- z - f / df
  while z != lastZ

  c : Color <- grey
  if z = r1:
    c <- red
  else if z = r2:
    c <- green
  else if z = r3:
    c <- blue

  s : R <- (cos (iterations pi / 10))^2
  color <- if z = lastZ then blend (s, dark c, light c) else black

  @viewer "Newton's method dynamics" var=z size=512x512 vanish=tol
  lastZ : C <- 0
  r1 : C <- 1
  r2 : C <- -0.5 + a
  r3 : C <- -0.5 - a

  repeat:
    lastZ <- z
    f : C <- (z - r1) (z - r2) (z - r3)
    df : C <- (z - r2) (z - r3) + (z - r1) (z - r3) + (z - r1) (z - r2)
    z <- z - f / df
  while z != lastZ

  c : Color <- grey
  if z = r1:
    c <- red
  else if z = r2:
    c <- green
  else if z = r3:
    c <- blue

  s : R <- (cos (iterations pi / 10))^2
  color <- if z = lastZ then blend (s, dark c, light c) else black

  @tool "Trace" for="Newton's method dynamics" shortcut=t
  on deactivated:
    erase

  on click-or-drag:
    lastZ : C <- 0
    r1 : C <- 1
    r2 : C <- -0.5 + a
    r3 : C <- -0.5 - a
    erase
    while z != lastZ:
      lastZ <- z
      f : C <- (z - r1) (z - r2) (z - r3)
      df : C <- (z - r2) (z - r3) + (z - r1) (z - r3) + (z - r1) (z - r2)
      z <- z - f / df
      draw point at lastZ
      draw line from lastZ to z
    draw point at z
