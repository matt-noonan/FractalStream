script: |
  @common
  # This script draws in the z-plane. It runs once per pixel in the view,
  # and should use the `color` variable to indicate what color to use for
  # that pixel.
  define script:
    iterate z -> z^2 + i until z escapes
    if stuck:
      color <- black
    else if im z > 0:
      color <- light rainbow(iterations / 20)
    else:
      color <- dark rainbow(iterations / 20)

  @viewer "One-variable complex dynamics" var=z size=600x600 pixelSize=1/100
  run script
