script: |
  @setup "Setup"
  expression : C as "iterate z ⟼ " using z:C, C:C <- z^2 + C
  exit_condition : Boolean as "until" using z:C, C:C <- z escapes
  initialZ : C as "Initial expression for z in parameter plane:" using C:C <- 0
  text "Color expressions can use color names like `red` or `black`, color functions involving the variables `z`, `C`, and `iterations`, or the color variables `color1` and `color2`."
  on_success : Color as "Color expression for success:" using z:C, C:C <- rainbow(iterations / 20)
  on_failure : Color as "Color expression for failure:" using z:C, C:C <- black

  @config "Configuration"
  C : C as "Selected value of C:" <- -0.1226 + 0.7449i
  maxIters : Z as "Iteration limit: " <- 100
  maxRadius : R as "Escape radius: " <- 10
  minRadius : R as "Vanishing radius: " <- 0.0001

  @viewer "Parametric complex dynamics parameter plane" var=C size="600x600" limit="maxIters" escape="maxRadius" vanish="minRadius"
  z : C <- «initialZ»
  iterate z -> «expression» until «exit_condition»
  color <- if stuck then «on_failure» else «on_success»

  @viewer "Parametric complex dynamics" var=z size="600x600" limit="maxIters" escape="maxRadius" vanish="minRadius"
  iterate z -> «expression» until «exit_condition»
  color <- if stuck then «on_failure» else «on_success»

  @tool "Trace" shortcut="t" for="Parametric complex dynamics"
  on refresh:
    erase
  on deactivated:
    erase
  on click-or-drag:
    use white for line
    erase
    prevZ : C <- z
    until «exit_condition»:
      prevZ <- z
      draw point at z
      z <- «expression»
      draw line from z to prevZ
