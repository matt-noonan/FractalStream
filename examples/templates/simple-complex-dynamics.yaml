script: |
  @setup "Setup"
  expression : C as "iterate z ⟼ " using z:C, C:C <- z^2 + i
  exit_condition : Boolean as "until" using z:C, C:C <- z escapes
  text "Color expressions can use color names like `red` or `black`, or color functions involving the variables `z`, `C`, and `iterations`."
  on_success : Color as "Color expression for success:" using z:C, C:C <- rainbow(iterations / 20)
  on_failure : Color as "Color expression for failure:" using z:C, C:C <- black

  @viewer "Simple complex dynamics" var=z size=600x600
  iterate z -> «expression» until «exit_condition»
  color <- if stuck then «on_failure» else «on_success»

  @tool "Trace" shortcut=t
  on refresh:
    erase
  on deactivated:
    erase
  on click-or-drag:
    use white for line
    erase
    prevZ : C <- z
    until «exit_condition»:
      prevZ <- z
      draw point at z
      z <- «expression»
      draw line from z to prevZ
