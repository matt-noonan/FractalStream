script: |
  @setup "Setup"
  text "This template can be used to make a script that draws in the z-plane and in the C-plane, where C is a complex parameter."
  text "The script runs once per pixel in the view, and should use the `color` variable to indicate what color to use for that pixel."
  text "Use the `dynamic` variable to test if the script is running in the `z`-plane."
  z0 : C as "Initial value for z in the C plane:" <- 0
  initialC : C as "Initial value for C:" <- 0
  code script using z:C, C:C:
    iterate z -> z^2 + C until z escapes
    if stuck:
      color <- black
    else if im z > 0:
      color <- light rainbow(iterations / 20)
    else:
      color <- dark rainbow(iterations / 20)

  @config "Configuration"
  C : C as "C =" <- «initialC»
  maxIters : Z as "Iteration limit: " <- 100
  maxRadius : R as "Escape radius: " <- 10
  minRadius : R as "Vanishing radius: " <- 0.0001

  @viewer "Parametric complex dynamics parameter plane" var=C size="600x600" limit="maxIters" escape="maxRadius" vanish="minRadius" pixelSize="1/100"
  dynamic : Boolean <- false
  z : C <- «z0»
  «script»

  @viewer "Parametric complex dynamics dynamical plane" var=z size="600x600" limit="maxIters" escape="maxRadius" vanish="minRadius" pixelSize="1/100"
  dynamic : Boolean <- true
  «script»
