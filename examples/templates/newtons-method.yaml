script: |
  @setup "Setup"
  f : C as "0 = " using z:C <- z^3 - 1
  text "Color expressions can use color names like `red` or `black`, color functions involving the variables `z` and `iterations`."
  basin_color : Color as "Color expression for basins:" using z:C <- rainbow(arg z / (2π))
  on_failure : Color as "Color expression for failure to converge:" using z:C <- black

  @config "Configuration"
  shade_convergence : Boolean as "Shade by convergence speed: " <- true

  @viewer "Newton's method on ℂ" var=z size="600x600"
  lastZ : C <- 0
  repeat:
    lastZ <- z
    z <- z - «f» / diff(z, «f»)
  until z = lastZ

  if stuck:
    color <- «on_failure»
  else:
    color <- «basin_color»
    if shade_convergence:
      color <- blend(iterations / 20, dark color, light color)

  @tool "Trace" shortcut="t"
  on refresh:
    erase
  on deactivated:
    erase
  on click-or-drag:
    use white for line
    erase
    prevZ : C <- z
    repeat:
      prevZ <- z
      draw point at z
      z <- z - «f» / diff(z, «f»)
      draw line from z to prevZ
    until z = prevZ
