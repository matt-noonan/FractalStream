script: |
  @common
  # the map, its second iterate, and its critical point
  let f(z) = z^2 + c
  let f2(w) = (w^2 + c)^2 + c
  let critical_point(c) = 0
  degree : Z <- 2

  @config "Internal Rays"
  continuous : Boolean as "continuous = " <- false
  den : Z as "denominator = " <- 3

  @config "Dynamics"
  c : C as "c = " <- 0
  maxIters : Z as "max iterations = " <- 300
  maxRadius : R as "escape radius = " <- 100.0
  minRadius : R as "vanishing radius = " <- 0.00001
  extra_iterations : Z as "extra iterations = " <- 1

  @config "Orbit Tracker"
  start : C as "orbit start = " <- 0

  @viewer "Parameter space" var=c size=800x800 limit=maxIters escape=maxRadius vanish=minRadius center=-0.5 pixelSize=1/200
  z : C <- critical_point(c)
  w : C <- z
  z0 : C <- z

  repeat:
    z <- f(z)
    w <- f2(w)
  until |z-w| vanishes or z escapes

  if stuck:
    color <- black

  else if z escaped:
    color <- if im(z) > 0 then blue else yellow

    s : R <- iterations + 1 - (log (log |z|)) / (log degree)
    color <- blend (cos (s pi)^2, light color, dark color)

  else:
    λ: C <- 1

    repeat:
      z <- f(z)
      λ <- diff(z, f(z)) λ
    until |z-w| vanishes

    period: Z <- iterations

    counter : Z <- 0
    while counter < extra_iterations period:
      w <- f2(w)

    z <- z0
    while not (|z-w| vanishes):
      z <- f(z)

    preperiod: Z <- iterations

    s : R <- preperiod / period
    θ : R <- arg λ
    pθ : R <- mod(θ / (2 pi), 1)

    if continuous:
      color <- rainbow(mod(pθ den, 1))
    else:
      color <- if mod(pθ, 1 / den) > 0.5 / den then red else rgb(0,1,1)

    s_adjusted : R <- s + 1 - log |z-w| / log |λ|
    color <- blend (cos (s_adjusted pi)^2, light color, dark color)

  @viewer "Dynamical plane" var=z size=800x800 limit=maxIters escape=maxRadius vanish=minRadius center=0 pixelSize=1/200
  w : C <- z
  z0 : C <- z

  repeat:
    z <- f(z)
    w <- f2(w)
  until |z-w| vanishes or z escapes

  if stuck:
    color <- black

  else if z escaped:
    color <- if im(z) > 0 then blue else yellow

    s : R <- iterations + 1 - (log (log |z|)) / (log degree)
    color <- blend (cos (s pi)^2, light color, dark color)

  else:
    λ: C <- 1

    repeat:
      z <- f(z)
      λ <- diff(z, f(z)) λ
    until |z-w| vanishes

    period: Z <- iterations

    counter : Z <- 0
    while counter < extra_iterations period:
      w <- f2(w)

    z <- z0
    while not (|z-w| vanishes):
      z <- f(z)

    preperiod: Z <- iterations

    s : R <- preperiod / period
    θ : R <- arg (z-w) - s arg λ
    pθ : R <- mod(θ / (2 pi), 1)

    if continuous:
      color <- rainbow(mod(pθ den, 1))
    else:
      color <- if mod(pθ, 1 / den) > 0.5 / den then red else rgb(0,1,1)

    s_adjusted : R <- s + 1 - log |z-w| / log |λ|
    color <- blend (cos (s_adjusted pi)^2, light color, dark color)

  @tool "Trace" for="Dynamical plane" shortcut=t
  on click-or-drag:
    start <- z
    w : C <- z
    lastZ : C <- z
    erase

    repeat:
      z <- f(z)
      w <- f2(w)
    until |z-w| vanishes or z escapes

    if |z-w| vanishes:
      z <- lastZ

      while not (|z-w| vanishes):
        lastZ <- z
        z <- f(z)

        draw point at lastZ
        draw line from lastZ to z

    use green for stroke
    draw circle at w with radius minRadius

  on refresh:
    z : C <- start
    w : C <- z
    lastZ : C <- 0
    erase

    repeat:
      z <- f(z)
      w <- f2(w)
    until |z-w| vanishes or z escapes

    if |z-w| vanishes:
      z <- lastZ

      while not (|z-w| vanishes):
        lastZ <- z
        z <- f(z)

        draw point at lastZ
        draw line from lastZ to z

    use green for stroke
    draw circle at w with radius minRadius
