script: |
  @config "Configuration"
  max_iters : Z as "Iteration limit" <- 100
  R : R as "Escape radius" <- 10
  size : R as "Julia set size" <- 0.05
  scale : R as "Julia set zoom level" <- 2.5
  dummy : R as "Dummy" <- 123

  @viewer "Mandelbrot set tiled by Julia sets" var=w size="512x512" limit="max_iters" escape="R"
  x : R <- mod(re w, size)
  y : R <- mod(im w, size)

  C : C <- w - (x + i y) + (1 + i) size / 2
  z : C <- (x + i y - (1 + i) size / 2) * scale / size

  iterate z -> z^2 + C until z escapes

  if stuck:
    color <- black
  else:
    m : R <- iterations + 1 - log (log (|z|^2) / (2 log R)) / log 2
    color <- rainbow(m / 20) #blend (2 arctan (m / 20) / pi, dark blue, white)
