script: |
  @setup "Parametric complex dynamics"
  f : C as "Iterate f(z) = " using z:C, C:C <- z^2 + C
  stop : Boolean as "until" using z:C, C:C, maxRadius:R <- |z| > maxRadius

  @config "Configuration"
  C : C as "Selected value of C:" <- -0.1226 + 0.7449i
  maxIters : Z as "Max. iterations: " <- 100
  maxRadius : R as "Max. radius: " <- 10
  drag_target : Z as "Dehn tool drag target: " <- 0

  @config "Dehn twist"
  twist_center : C as "Center of twist:" <- -0.267 + 0.478i
  row:
    r0 : R as "Inner radius" <- 0.2
    r1 : R as "Outer radius" <- 0.5

  @viewer "Parameter space" var=C size="512x512" limit="maxIters" escape="maxRadius"
  z : ℂ ⭠ 0
  until «stop»:
    z ⭠ «f»
    d : ℝ ⭠ |z - twist_center|
    if d > r0 and d < r1:
      theta : ℝ ⭠ 2 pi (d - r0) / (r1 - r0)
      z ⭠ e^(i theta) (z - twist_center) + twist_center

  if stuck:
    color ⭠ black
  else:
    c1 : Color ⭠ if im(z) > 0 then blue else yellow
    c2 : Color ⭠ if im(z) > 0 then green else red
    s : ℝ ⭠ iterations + 1 - (log (log (|z|²) / (2 log maxRadius))) / log 2
    s ⭠ cos (s π / 10)²
    color ⭠ blend (s, c1, c2)

  @viewer "Twisted dynamical plane" var=z size="512x512" limit="maxIters" escape="maxRadius" pixelVar="px" position="620x104"
  until «stop»:
    z ⭠ «f»
    d : ℝ ⭠ |z - twist_center|
    if d > r0 and d < r1:
      theta : ℝ ⭠ 2π (d - r0) / (r1 - r0)
      z ⭠ e^(i theta) (z - twist_center) + twist_center

  if stuck:
    color ⭠ black
  else:
    c1 : Color ⭠ if im(z) > 0 then blue else yellow
    c2 : Color ⭠ if im(z) > 0 then green else red
    s : ℝ ⭠ iterations + 1 - (log (log (|z|²) / (2 log maxRadius))) / log 2
    s ⭠ cos (s π / 10)²
    color ⭠ blend (s, c1, c2)

  @tool "Trace" for="Twisted dynamical plane" shortcut="t"
  on deactivated:
    erase
  on click-or-drag:
    prevZ : ℂ ⭠ z
    k : ℤ ⭠ 0
    erase
    until «stop» up to 100 times:
      prevZ ⭠ z
      draw point at z
      z ⭠ «f»
      d : ℝ ⭠ |z - twist_center|
      if d > r0 and d < r1:
        theta : ℝ ⭠ 2π (d - r0) / (r1 - r0)
        z ⭠ e^(i theta) (z - twist_center) + twist_center
      draw line from z to prevZ

  @tool "Dehn twist" for="Twisted dynamical plane" shortcut="d"
  on activated:
    use red for stroke
    draw point at twist_center
    use white for stroke
    draw circle at twist_center with radius r0
    draw circle at twist_center with radius r1
  on deactivated:
    erase
  on drag-finished:
    drag_target ⭠ 0
  on drag from z0 to z:
    eps : ℝ ⭠ 5 px
    if drag_target = 0:
      if |z0 - twist_center| < eps:
        drag_target ⭠ 1
      else if |(|z0 - twist_center|) - r0| < eps:
        drag_target ⭠ 2
      else if |(|z0 - twist_center|) - r1| < eps:
        drag_target ⭠ 3

    if drag_target = 1:
      twist_center ⭠ z
    if drag_target = 2:
      r0 ⭠ |z - twist_center|
    if drag_target = 3:
      r1 ⭠ |z - twist_center|
    if drag_target > 0:
      erase
      use red for stroke
      draw point at twist_center
      use white for stroke
      draw circle at twist_center with radius r0
      draw circle at twist_center with radius r1
