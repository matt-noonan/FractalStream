name: Landing page

# Builds the landing page from site/ and deploys it to GitHub Pages, with
# @VERSION@ in site/index.html replaced by a release's version (its tag
# without the leading v). Nothing is committed: the rewritten copy is
# uploaded as a Pages artifact and deployed from there.
#
# The web app goes with it, at /app/: built and checked from the release's
# tag by web.yml (as a job of this workflow), and deployed only if its
# checks pass. So the app on the site is always the release the page
# points at.
#
# It deploys when:
#   - a release is published (pre-releases too), pointing the page at that
#     release. This is publishing, not release.yml drafting the release:
#     a draft's files can't be downloaded yet, so the links would 404.
#   - it is run by hand from the Actions tab, pointing the page at the tag
#     given, or at the newest published release if left blank.
# Merging to main doesn't deploy: a change to site/ goes live with the
# next release, or on a run by hand.
#
# The page is always built from site/ on main, even for a release, so a
# release tagged before a change to the page still gets the change.
#
# Pages keys each deployment by the commit of the run that made it, and
# quietly keeps what it already has when asked to deploy a commit again.
# So a run by hand from main, when main is the commit the live deployment
# was made from, reports success but changes nothing. (A release run is
# made from its tag's commit, so this also bites a second release tagged on
# the same commit as the one already deployed.) To get around it, merge
# anything to main, then run this by hand from main.
#
# Repository settings this needs:
#   - Settings > Pages > Source: GitHub Actions.
#   - Settings > Environments > github-pages > Deployment branches and
#     tags: allow the main branch and tags matching v*. A release runs
#     this workflow from its tag, so without the tag rule its deploy is
#     refused.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to point the page at, like v1.2.3 (blank: the newest published release)'
        required: false

# One deploy at a time, and never cancel one partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Which release the page points at, and the web app is built from.
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - id: tag
      name: Pick the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: |
        if [[ -z "$TAG" ]]; then
          # (FractalStream's: not the CI dependencies', ci-deps-N)
          TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
                   --limit 50 --json tagName --jq '[.[].tagName | select(startswith("v"))][0] // ""')"
          if [[ -z "$TAG" ]]; then
            echo "::error::There is no published release to point the page at"
            exit 1
          fi
        fi
        # The same rule as release.yml's check-tag job; it also keeps the
        # version safe to put in the build job's sed expression.
        if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9]+(\.[A-Za-z0-9]+)*)?$ ]]; then
          echo "::error::Release tags must look like v1.2.3 or v1.2.3-beta.1, not $TAG"
          exit 1
        fi
        if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]]; then
          echo "::error::$TAG is not a published release"
          exit 1
        fi
        echo "Pointing the page at $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # The web app, from the release's tag (see web.yml): its `web-app`
  # artifact.
  app:
    needs: tag
    uses: ./.github/workflows/web.yml
    # (actions: write: web.yml deletes the package cache a new one replaces)
    permissions:
      contents: read
      actions: write
    with:
      ref: ${{ needs.tag.outputs.tag }}

  build:
    needs: [tag, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Check out main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Fill in the version
      env:
        TAG: ${{ needs.tag.outputs.tag }}
      run: |
        if ! grep -q '@VERSION@' site/index.html; then
          echo "::error::site/index.html has no @VERSION@ to fill in"
          exit 1
        fi
        sed -i "s/@VERSION@/${TAG#v}/g" site/index.html
        grep -n "${TAG#v}" site/index.html

    - name: Put the web app at /app/
      uses: actions/download-artifact@v4
      with:
        name: web-app
        path: site/app

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - id: deploy
      uses: actions/deploy-pages@v4
