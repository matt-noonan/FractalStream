name: Release

# Pushing a tag like v2.0.0 builds FractalStream for macOS, Linux and
# Windows, and attaches the results to a draft GitHub Release:
#   FractalStream-<version>-macos-<arch>.zip          the app, signed and
#                                                     notarized (for the
#                                                     Homebrew cask)
#   fsrun-<version>-macos-<arch>.tar.gz               fsrun (for the Homebrew
#                                                     formula)
#   FractalStream-<version>-linux-x86_64.AppImage     the app
#   fsrun-<version>-linux-x86_64.tar.gz               fsrun, with the shared
#                                                     libraries it needs
#   FractalStream-<version>-windows-x86_64-setup.exe  an installer for the app
#                                                     and fsrun
#   FractalStream-<version>-windows-x86_64.zip        the same, as a portable
#                                                     folder
# The release notes list each file's sha256, for updating the Homebrew tap.
# Review the draft and publish it by hand; Homebrew can only download the
# files once the release is published.
#
# Tags must look like v1.2.3 or v1.2.3-beta.1 (ASCII only): GitHub rewrites
# other characters in the release's file names, and Homebrew's version
# checks only understand these. Once the release is drafted, the caches the
# builds saved for this tag are deleted, since nothing else can use them.

on:
  push:
    tags:
      - 'v*'

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    steps:
    - name: Check the tag's name
      env:
        TAG: ${{ github.ref_name }}
      run: |
        if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9]+(\.[A-Za-z0-9]+)*)?$ ]]; then
          echo "::error::Release tags must look like v1.2.3 or v1.2.3-beta.1, not $TAG"
          exit 1
        fi

  macos:
    needs: check-tag
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    uses: ./.github/workflows/macos-build.yml
    with:
      runner: ${{ matrix.runner }}
      wxwidgets: build-static
      notarize: true
      version: ${{ github.ref_name }}
    secrets: inherit

  linux:
    needs: check-tag
    uses: ./.github/workflows/linux-build.yml
    with:
      version: ${{ github.ref_name }}

  windows:
    needs: check-tag
    uses: ./.github/workflows/windows-build.yml
    with:
      backend: llvm
      version: ${{ github.ref_name }}

  release:
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Download the builds
      uses: actions/download-artifact@v4
      with:
        pattern: '{macos,linux,windows}-*'
        merge-multiple: true
        path: dist

    - name: Create a draft release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd dist
        ls -l
        {
          echo "## sha256"
          echo
          echo '```'
          sha256sum FractalStream-* fsrun-*
          echo '```'
        } > notes.md
        cat notes.md
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
          --title "FractalStream ${TAG#v}" --notes-file notes.md \
          FractalStream-* fsrun-*

  # Runs only once the draft exists, so a failed build can still be re-run
  # with its caches.
  delete-tag-caches:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
    - name: Delete this tag's caches
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        # A tag's caches are listed with refs/heads/refs/tags/<tag> as
        # their ref, so match on the end.
        gh cache list --repo "$GITHUB_REPOSITORY" --limit 1000 --json id,key,ref \
          --jq ".[] | select(.ref | endswith(\"refs/tags/$TAG\")) | \"\\(.id) \\(.key)\"" |
        while read -r id key; do
          echo "Deleting $key"
          gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
        done
