name: Windows build

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Which backend should FractalStream use?'
        required: true
        default: 'llvm'
        type: choice
        options:
          - 'llvm'
          - 'pure'

jobs:
  build:
    uses: ./.github/workflows/windows-build.yml
    with:
      backend: ${{ inputs.backend }}
