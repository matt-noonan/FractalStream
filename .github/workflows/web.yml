name: Web app

# Builds the web app (see WEB_PLAN.md) with the GHC wasm toolchain, runs
# the wasm end-to-end tests under Node and the app's checks in headless
# Chromium (dev-tools/web/check.mjs and check-tools.mjs), and uploads the
# built app (web/dist) as the `web-app` artifact.
#
# It runs on pushes and pull requests that touch the web app or what it's
# built from, and from pages.yml, which deploys the artifact at /app/.
# (The comparisons with the native LLVM build, dev-tools/wasm/compare*.sh,
# need that build, and are left out to keep this quick.)

on:
  push:
    branches: [main, web]
    paths:
      - 'fractalstream-core/**'
      - 'fractalstream-backend-pure/**'
      - 'fractalstream-backend-wasm/**'
      - 'fractalstream-backend-wgsl/**'
      - 'fractalstream-library/**'
      - 'fractalstream-ui-headless/**'
      - 'fractalstream-ui-web/**'
      - 'fractalstream-gitinfo/**'
      - 'web/**'
      - 'dev-tools/wasm/**'
      - 'dev-tools/web/**'
      - 'cabal.project.wasm'
      - 'cabal/**'
      - 'dev-tools/ci/prune-caches.sh'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'fractalstream-core/**'
      - 'fractalstream-backend-pure/**'
      - 'fractalstream-backend-wasm/**'
      - 'fractalstream-backend-wgsl/**'
      - 'fractalstream-library/**'
      - 'fractalstream-ui-headless/**'
      - 'fractalstream-ui-web/**'
      - 'fractalstream-gitinfo/**'
      - 'web/**'
      - 'dev-tools/wasm/**'
      - 'dev-tools/web/**'
      - 'cabal.project.wasm'
      - 'cabal/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'What to build (blank: what the calling workflow checked out)'
        type: string
        default: ''

concurrency:
  group: web-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  # ghc-wasm-meta, pinned (its bootstrap.sh would take the newest), with
  # GHC 9.10
  GHC_WASM_META: 8079eb96bbc63823d99ad8acaff0765532625474
  FLAVOUR: '9.10'

jobs:
  web:
    runs-on: ubuntu-24.04
    # (actions: write, to delete the package cache a new one replaces)
    permissions:
      contents: read
      actions: write
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        # (for the git metadata the build writes)
        fetch-depth: 0

    # A native GHC and cabal too, for the native hspec-discover the test
    # suites need (see dev-tools/wasm/build.sh).
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.10.3'
        cabal-version: 'latest'

    # (Caches are restored on every run, but saved only from main: one
    # saved for a pull request or a tag can only be restored by that same
    # pull request or tag, so it would just crowd out main's.)
    - name: Get the cached wasm toolchain
      id: toolchain
      uses: actions/cache/restore@v4
      with:
        path: ~/.ghc-wasm
        key: ghc-wasm-${{ runner.os }}-${{ env.GHC_WASM_META }}-${{ env.FLAVOUR }}

    - name: Install the wasm toolchain
      if: steps.toolchain.outputs.cache-hit != 'true'
      run: |
        dir="$(mktemp -d)"
        curl -f -L --retry 5 "https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/archive/$GHC_WASM_META/ghc-wasm-meta-$GHC_WASM_META.tar.gz" \
          | tar xz --strip-components=1 -C "$dir"
        (cd "$dir" && ./setup.sh)

    - name: Save the wasm toolchain
      if: github.ref == 'refs/heads/main' && steps.toolchain.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.ghc-wasm
        key: ghc-wasm-${{ runner.os }}-${{ env.GHC_WASM_META }}-${{ env.FLAVOUR }}

    - name: Put the wasm toolchain on the path
      run: ~/.ghc-wasm/add_to_github_path.sh

    - name: Get the cached Haskell packages
      id: packages
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.ghc-wasm/.cabal/store
          ~/.cabal/store
          dist-newstyle
        key: web-cabal-${{ runner.os }}-${{ env.GHC_WASM_META }}-${{ github.run_id }}
        restore-keys: web-cabal-${{ runner.os }}-${{ env.GHC_WASM_META }}-

    - name: Update the package lists
      run: |
        cabal update
        wasm32-wasi-cabal update

    - name: Install the page's packages
      run: npm ci
      working-directory: web

    - name: Build the web app
      run: dev-tools/web/build.sh

    - name: Run the end-to-end tests on wasm, under Node
      run: |
        dev-tools/wasm/build.sh --enable-tests fractalstream-ui-headless:test:end-to-end
        cd fractalstream-ui-headless
        ../dev-tools/wasm/node.sh fractalstream-ui-headless:test:end-to-end

    # (CI has no GPU: this is what the GPU backends compile and decline,
    # through a device that keeps their shaders; the GPU itself is checked
    # by hand, with dev-tools/web/check-gpu.mjs: GPU_PLAN.md, G10)
    - name: Run the GPU backends' spec on wasm, under Node
      run: |
        dev-tools/wasm/build.sh --enable-tests fractalstream-backend-wgsl:test:spec
        dev-tools/wasm/node.sh fractalstream-backend-wgsl:test:spec

    - name: Install Chromium for the checks
      run: node ~/.ghc-wasm/nodejs/lib/node_modules/playwright/cli.js install --with-deps chromium

    - name: Check every library project
      run: node dev-tools/web/check.mjs

    - name: Check the tools
      run: node dev-tools/web/check-tools.mjs

    # (after everything passed, as actions/cache would have; from main
    # only. Each run's replaces the last: it's keyed by the run, so that
    # dist-newstyle's builds of our own packages stay recent, and the one
    # it replaces is deleted.)
    - name: Save the Haskell packages
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.ghc-wasm/.cabal/store
          ~/.cabal/store
          dist-newstyle
        key: web-cabal-${{ runner.os }}-${{ env.GHC_WASM_META }}-${{ github.run_id }}

    - name: Delete the package cache this one replaces
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        dev-tools/ci/prune-caches.sh "web-cabal-${{ runner.os }}-${{ env.GHC_WASM_META }}-" \
          "web-cabal-${{ runner.os }}-${{ env.GHC_WASM_META }}-${{ github.run_id }}"

    - uses: actions/upload-artifact@v4
      with:
        name: web-app
        path: web/dist
        if-no-files-found: error
