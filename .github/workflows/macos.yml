name: macOS build

on:
  workflow_dispatch:
    inputs:
      wxwidgets:
        description: 'How should we get the wxWidgets 3.2 dependency?'
        required: true
        default: 'build-static'
        type: choice
        options:
          - 'homebrew'
          - 'build-static'
          - 'build-dynamic'
      notarize:
        description: 'Submit the signed app bundle to the Apple notary service?'
        required: true
        type: boolean
      jemalloc:
        description: 'Link against jemalloc?'
        required: true
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/macos-build.yml
    with:
      runner: macos-15
      wxwidgets: ${{ inputs.wxwidgets }}
      notarize: ${{ inputs.notarize }}
      jemalloc: ${{ inputs.jemalloc }}
    secrets: inherit
