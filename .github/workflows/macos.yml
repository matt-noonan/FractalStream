name: macOS build

on:
  workflow_dispatch:
    inputs:
      wxwidgets:
        description: 'How should we get the wxWidgets 3.2 dependency?'
        required: true
        default: 'build-static'
        type: choice
        options:
          - 'homebrew'
          - 'build-static'
      notarize:
        description: 'Submit the signed app bundle to the Apple notary service?'
        required: true
        type: boolean
  # Also on pushes to main that change what it's built from, and twice a
  # week, so that main's ~/.stack cache stays fresh (a cache unused for a
  # week is deleted). And on pull requests that change what it's built
  # from, as a check that the desktop app still builds: signed ad hoc,
  # without the Developer ID certificate, and saving no caches.
  push:
    branches: [main]
    paths:
      - 'fractalstream-core/**'
      - 'fractalstream-library/**'
      - 'fractalstream-backend-llvm/**'
      - 'fractalstream-backend-pure/**'
      - 'fractalstream-backend-wgsl/**'
      - 'fractalstream-backend-wgpu/**'
      - 'fractalstream-ui-wx/**'
      - 'fractalstream-ui-headless/**'
      - 'dev-tools/ci/**'
      - 'dev-tools/wgpu/**'
      - 'patches/**'
      - '.github/workflows/macos.yml'
      - '.github/workflows/macos-build.yml'
  pull_request:
    paths:
      - 'fractalstream-core/**'
      - 'fractalstream-library/**'
      - 'fractalstream-backend-llvm/**'
      - 'fractalstream-backend-pure/**'
      - 'fractalstream-backend-wgsl/**'
      - 'fractalstream-backend-wgpu/**'
      - 'fractalstream-ui-wx/**'
      - 'fractalstream-ui-headless/**'
      - 'dev-tools/ci/**'
      - 'dev-tools/wgpu/**'
      - 'patches/**'
      - '.github/workflows/macos.yml'
      - '.github/workflows/macos-build.yml'
  schedule:
    - cron: '17 6 * * 1,4'

# (a pull request's newer pushes cancel its older builds; anything else
# gets a group of its own, so runs on main all go ahead)
concurrency:
  group: macos-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # (the build deletes the caches a new one replaces)
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/macos-build.yml
    with:
      runner: macos-15
      wxwidgets: ${{ inputs.wxwidgets || 'build-static' }}
      sign: ${{ github.event_name != 'pull_request' }}
      notarize: ${{ inputs.notarize || false }}
    secrets: inherit
