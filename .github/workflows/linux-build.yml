name: Linux build (reusable)

# The Linux build, shared by linux.yml and release.yml. Builds the
# FractalStream AppImage and the fsrun command-line tool, and uploads them as
# one artifact named linux-x86_64, holding
#   FractalStream-<suffix>.AppImage   the app
#   fsrun-<suffix>.tar.gz             fsrun, with the shared libraries it needs
# where <suffix> is <version>-linux-x86_64 when a version is given, and
# <commit>-linux-x86_64 otherwise.
#
# LLVM 12 and wxc are prebuilt by deps.yml (see dev-tools/ci/deps.env);
# LLVM is linked statically. fsrun is shipped with every shared library it
# uses except glibc's own, found next to it by an $ORIGIN rpath. Building on
# Ubuntu 24.04 means both need glibc 2.39 or newer.

on:
  workflow_call:
    inputs:
      version:
        description: 'The release version (a leading "v" is dropped); empty for a development build'
        required: false
        default: ''
        type: string

jobs:
  build:

    runs-on: ubuntu-24.04
    # (actions: write, to delete the ~/.stack caches a new one replaces)
    permissions:
      contents: read
      actions: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:

    - uses: actions/checkout@v4
      with:
        # (all of it, for the version githash gets from git describe)
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt update

        # Install fuse for appimage, icnsutils for converting the macos icns
        # file, and patchelf for fsrun's bundled libraries
        sudo apt install libfuse2 icnsutils patchelf

        # Install appimagetool and linuxbuilder
        wget https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        sudo mv appimagetool-x86_64.AppImage /usr/bin/appimagetool
        sudo chmod +x /usr/bin/appimagetool
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
        sudo mv linuxdeploy-x86_64.AppImage /usr/bin/linuxdeploy
        sudo chmod +x /usr/bin/linuxdeploy
        echo "/usr/bin" >> $GITHUB_PATH

        # (Haskell stack is already installed in this runner)

    - name: Install wxWidgets 3.2
      run: |
        sudo apt install libwxgtk3.2-dev
        sudo apt install libwxgtk-media3.2-dev
        sudo ln -s /usr/bin/wx-config /usr/bin/wx-config-3.2

    - name: Fetch wxc and LLVM 12
      run: |
        dev-tools/ci/fetch-deps.sh /usr/local "$(dev-tools/ci/asset.sh wxc)" "$(dev-tools/ci/asset.sh llvm)"
        sudo ldconfig
        llvm-config --version

    # ~/.stack holds the snapshot's packages and the extra-deps, which
    # change only with what dev-tools/ci/stack-cache-key.sh fingerprints:
    # so it's saved (from main) only when that changes, as soon as they're
    # built, and the one it replaces is deleted.
    - name: Work out the ~/.stack cache's key
      id: stack-key
      run: |
        prefix="${{ runner.os }}-stack-"
        echo "prefix=$prefix" >> $GITHUB_OUTPUT
        echo "key=$prefix$(dev-tools/ci/stack-cache-key.sh)" >> $GITHUB_OUTPUT

    - name: Get cached ~/.stack
      id: stack-cache
      uses: actions/cache/restore@v4
      with:
        key: ${{ steps.stack-key.outputs.key }}
        restore-keys: ${{ steps.stack-key.outputs.prefix }}
        path: ~/.stack

    - name: Fetch wgpu-native (the GPU backends' WebGPU)
      run: dev-tools/wgpu/fetch.sh

    - name: Build Haskell dependencies
      run: |
        cd fractalstream-ui-wx
        stack build --only-snapshot

    # (Saved only from main: a cache saved for a pull request or a tag,
    # such as a release's, can only be restored by that same pull request
    # or tag, so it would just crowd out main's. A release restores main's.)
    - if: ${{ github.ref == 'refs/heads/main' && steps.stack-cache.outputs.cache-hit != 'true' }}
      name: Save ~/.stack
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.stack-key.outputs.key }}
        path: ~/.stack

    - if: ${{ github.ref == 'refs/heads/main' && steps.stack-cache.outputs.cache-hit != 'true' }}
      name: Delete the ~/.stack cache this one replaces
      run: dev-tools/ci/prune-caches.sh "${{ steps.stack-key.outputs.prefix }}" "${{ steps.stack-key.outputs.key }}"

    # (fsrun too: it's in the app's stack project)
    - name: Build FractalStream and fsrun
      run: |
        cd fractalstream-ui-wx
        icns2png -x FS.icns
        stack build

    - name: Bundle fsrun
      run: |
        set -euo pipefail
        mkdir -p fsrun-dist/bin fsrun-dist/lib
        cp "$(cd fractalstream-ui-wx && stack path --local-install-root)/bin/fsrun" fsrun-dist/bin/
        cd fsrun-dist
        strip bin/fsrun

        # Bundle every shared library fsrun uses (ldd lists them all,
        # transitively), except glibc's own, and have each find the others
        # next to itself.
        ldd bin/fsrun \
          | awk '/=> \// { print $3 }' \
          | grep -vE '/(libc|libm|libdl|libpthread|librt|libresolv|libutil|ld-linux[^/]*)\.so' \
          | xargs -I{} cp -L {} lib/
        patchelf --set-rpath '$ORIGIN/../lib' bin/fsrun
        for l in lib/*; do patchelf --set-rpath '$ORIGIN' "$l"; done
        ls -l bin lib

    - name: Check fsrun
      run: |
        set -euo pipefail
        ldd fsrun-dist/bin/fsrun
        # (LLVM is linked in, and none of it is exported: a graphics
        # driver that uses its own LLVM would call ours instead, and crash)
        if ldd fsrun-dist/bin/fsrun | grep -qi llvm; then
          echo "fsrun links a shared LLVM"; exit 1
        fi
        exported="$(nm -D --defined-only fsrun-dist/bin/fsrun | grep -ci llvm || true)"
        echo "LLVM symbols fsrun exports: $exported"
        if [ "$exported" != 0 ]; then
          echo "fsrun exports LLVM's symbols"; exit 1
        fi
        if ldd fsrun-dist/bin/fsrun | grep -q "not found"; then
          echo "Some libraries were not found"; exit 1
        fi
        fsrun-dist/bin/fsrun --version
        printf 'script: |\n  @viewer "Plane" var=z\n  color <- if |z| < 1 then blue else black\n' > plane.yaml
        fsrun-dist/bin/fsrun snapshot --project plane.yaml --viewer Plane --output plane.png
        ls -l plane.png
        # (the runner has no GPU: drawing on it must say so, or draw with
        # a software driver, not crash; a panic in wgpu aborts, with 134)
        status=0
        fsrun-dist/bin/fsrun snapshot --backend gpu-df64 --project plane.yaml --viewer Plane --output plane-gpu.png 2>&1 | tee gpu.log || status=${PIPESTATUS[0]}
        echo "fsrun on the GPU: exit status $status"
        if [ "$status" -gt 1 ]; then echo "fsrun crashed on the GPU"; exit 1; fi
        # (and with a GPU, its shaders must have gone through the probe,
        # Backend.WGPU.Probe: one that couldn't start says so)
        if grep -q "without a probe" gpu.log; then echo "the GPU's probe didn't start"; exit 1; fi

    - name: Archive the AppImage and fsrun
      id: archive
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then
          SUFFIX="${VERSION#v}-linux-x86_64"
        else
          SUFFIX="$GITHUB_SHA-linux-x86_64"
        fi
        (cd fractalstream-ui-wx &&
         cp "$(stack path --dist-dir)/build/FractalStream-x86_64.AppImage" "../FractalStream-$SUFFIX.AppImage")
        mv fsrun-dist "fsrun-$SUFFIX"
        tar czf "fsrun-$SUFFIX.tar.gz" "fsrun-$SUFFIX"
        sha256sum "FractalStream-$SUFFIX.AppImage" "fsrun-$SUFFIX.tar.gz"
        echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        # (a week, for the builds that run on their own, which are there to
        # keep main's caches fresh; else the repository's default)
        retention-days: ${{ inputs.version == '' && (github.event_name == 'schedule' || github.event_name == 'push') && 7 || 0 }}
        name: linux-x86_64
        path: |
          FractalStream-${{ steps.archive.outputs.suffix }}.AppImage
          fsrun-${{ steps.archive.outputs.suffix }}.tar.gz
