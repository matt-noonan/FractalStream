resolver: lts-24.12

# Each project builds its packages (including ../fractalstream-core and the
# backends) in its own folder, so that a change built by one project isn't
# treated as already built by the others.
work-dir: .stack-work-ui-wx

packages:
- .
- ../fractalstream-core
- ../fractalstream-backend-llvm

extra-deps:

- git: https://github.com/matt-noonan/cabal-macosx.git
  commit: 7e892fbeb761f4adb29d52b5377e6a1869faf48d

- git: https://github.com/matt-noonan/llvm-hs.git
  commit: 0746a412c4018667f897b1382625f9a7239167ec
  subdirs:
    - llvm-hs
    - llvm-hs-pure

- git: https://github.com/mgrabmueller/disassembler
  commit: 15a15db1fba50fd0ce52f26f43550fbad5529bf8

- git: https://github.com/matt-noonan/wxHaskell-3.2.git
  commit: de15548c6587891cca9228a8fedf2336c72a5f3b
  subdirs:
    - wx
    - wxcore
    - wxdirect

flags:
  llvm-hs:
    shared-llvm: false

ghc-options:
  llvm-hs:
    -optcxx=-std=c++17 -optcxx=-DNDEBUG

allow-newer: true
