resolver: lts-24.12

packages:
- .
- ../fractalstream-core
- ../fractalstream-backend-llvm

extra-deps:

- git: https://github.com/matt-noonan/llvm-hs.git
  commit: 0746a412c4018667f897b1382625f9a7239167ec
  subdirs:
    - llvm-hs
    - llvm-hs-pure

- git: https://github.com/mgrabmueller/disassembler
  commit: 15a15db1fba50fd0ce52f26f43550fbad5529bf8

flags:
  llvm-hs:
    shared-llvm: false

ghc-options:
  llvm-hs:
    -optcxx=-std=c++17 -optcxx=-DNDEBUG

allow-newer: true
